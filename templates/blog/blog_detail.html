{% extends 'base.html' %} {% block title %}{{ post.title }} - Elvis T. Harmon{% endblock %} {% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary mb-4">← Back to Blog</a>

            <h1 class="mb-3">{{ post.title }}</h1>
            <p class="text-muted mb-4">{{ post.created_at|date:"F j, Y" }}</p>

            <div class="blog-content">
                {{ post.content|safe }}
            </div>
        </div>
    </div>
</div>
{% endblock %}
