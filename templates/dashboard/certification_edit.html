{% extends 'dashboard/base_dashboard.html' %} {% load static %} {% block title %}Edit Certification - Admin Panel{% endblock %} {% block page_title %}Edit Certification{% endblock %} {% block content %}
<div class="container-fluid px-4">
    <div class="dashboard-card">
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Certification Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" value="{{ certification.name }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Organization <span class="text-danger">*</span></label>
                            <input type="text" name="organization" class="form-control" value="{{ certification.organization }}" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Issue Date <span class="text-danger">*</span></label>
                            <input type="date" name="issue_date" class="form-control" value="{{ certification.issue_date|date:'Y-m-d' }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Expiry Date</label>
                            <input type="date" name="expiry_date" class="form-control" value="{{ certification.expiry_date|date:'Y-m-d'|default:'' }}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Credential ID</label>
                            <input type="text" name="credential_id" class="form-control" value="{{ certification.credential_id|default:'' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Credential URL</label>
                            <input type="url" name="credential_url" class="form-control" value="{{ certification.credential_url|default:'' }}">
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="mb-3">
                            <label class="form-label">Certificate Image</label> {% if certification.certificate_image %}
                            <div class="mb-2">
                                <img src="{{ certification.certificate_image.url }}" alt="{{ certification.name }}" style="max-height: 100px;">
                            </div>
                            {% endif %}
                            <input type="file" name="certificate_image" class="form-control" accept="image/*,.pdf">
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" name="is_verified" class="form-check-input" {% if certification.is_verified %}checked{% endif %}>
                                <label class="form-check-label">Verified</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>Update Certification
                    </button>
                    <a href="{% url 'dashboard:certifications' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
