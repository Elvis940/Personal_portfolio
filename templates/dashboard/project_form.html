{% extends 'dashboard/base_dashboard.html' %} {% load static %} {% block title %} Add Project - Admin Panel {% endblock %} {% block page_title %} Add New Project {% endblock %} {% block content %}
<div class="container-fluid px-4">
    <div class="dashboard-card">
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-4">
                    <div class="col-md-8">
                        <div class="mb-3">
                            <label class="form-label">Title <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Summary <span class="text-danger">*</span></label>
                            <input type="text" name="summary" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="5"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">GitHub URL</label>
                                    <input type="url" name="github_url" class="form-control">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Live Demo URL</label>
                                    <input type="url" name="live_demo_url" class="form-control">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Problem Statement</label>
                            <textarea name="problem" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Solution</label>
                            <textarea name="solution" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Features</label>
                            <textarea name="features" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Challenges</label>
                            <textarea name="challenges" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Lessons Learned</label>
                            <textarea name="lessons_learned" class="form-control" rows="3"></textarea>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="mb-3">
                            <label class="form-label">Featured Image</label>
                            <input type="file" name="featured_image" class="form-control" accept="image/*">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select name="status" class="form-select">
                                <option value="COMPLETED">Completed</option>
                                <option value="IN_PROGRESS">In Progress</option>
                                <option value="CONCEPT">Concept</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Categories</label>
                            <select name="categories" class="form-select" multiple>
                                {% for category in categories %}
                                    <option value="{{ category.id }}">{{ category.name }}</option>
                                {% endfor %}
                            </select>
                            <small class="text-muted">Hold Ctrl to select multiple</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Technologies</label>
                            <select name="technologies" class="form-select" multiple>
                                {% for tech in technologies %}
                                    <option value="{{ tech.id }}">{{ tech.name }}</option>
                                {% endfor %}
                            </select>
                            <small class="text-muted">Hold Ctrl to select multiple</small>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" name="is_featured" class="form-check-input">
                                <label class="form-check-label">Featured Project</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" name="is_published" class="form-check-input" checked>
                                <label class="form-check-label">Published</label>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Start Date</label>
                                    <input type="date" name="start_date" class="form-control">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">End Date</label>
                                    <input type="date" name="end_date" class="form-control">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>Create Project
                    </button>
                    <a href="{% url 'dashboard:projects' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
